name: Polymath Robotics
description: >-
  Polymath Robotics builds general autonomy and safety software for off-highway
  and industrial vehicles such as tractors, loaders, dozers, and mining trucks.
  Its Synapse REST API lets developers command a real or simulated
  Polymath-powered vehicle: sending GPS and relative waypoints, issuing motion
  and vehicle commands, reading combined autonomy, navigation, and vehicle
  feedback, managing exclusive teleoperation control leases, and streaming media
  over LiveKit. Caladan, its browser-based simulation environment, lets teams
  build and test autonomous behaviors in Python without ROS, Gazebo, or Linux
  before deploying to physical machines. Founded in 2021 (YC S22), San Francisco.
