  envelope: ErrorResponse | HTTPExceptionResponse
- status: 404
  title: Resource not found
  meaning: The referenced resource (device, file, room, reference target) does not exist.
  envelope: ErrorResponse | HTTPExceptionResponse
- status: 422
  title: Validation error
  meaning: Request body or parameters failed schema validation.
